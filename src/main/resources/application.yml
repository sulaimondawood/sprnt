server:
  servlet:
    context-path: /api/v1
spring:
  config:
    import:
      - optional:file:.env[.properties]

  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    # username: admin
    # password: admin
    # url: jdbc:postgresql://localhost:5433/sprnt_db
  jpa:
    hibernate:
      ddl-auto: update

  mail:
    host: ${SMTP_HOST}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    port: 2525
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  kafka:
    bootstrap-servers: ${KAFKA_HOST}
    security:
      protocol: SSL
    ssl:
      key-store-type: PEM
      key-store-certificate-chain: ${KAFKA_ACCESS_CERT}
      key-store-key: ${KAFKA_ACCESS_KEY}
      trust-store-type: PEM
      trust-store-certificates: ${KAFKA_CA_CERT}

      # key-store-type: PKCS12
      # key-store-location: file:src/main/resources/kafka/client.keystore.p12
      # key-password: dawood
      # key-store-password: dawood
      # trust-store-type: JKS
      # trust-store-location: file:src/main/resources/kafka/client.truststore.jks
      # trust-store-password: dawood

      # bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  flyway:
    enabled: false
    baseline-on-migrate: true

  data:
    redis:
      # host: localhost
      # port: 6379
      url: ${REDIS_CONNECTION_STRING}
      ssl:
        enabled: true

app:
  base-url: ${BASE_URL}
  client-url: ${CLIENT_URL}
  email: ${MAIL_USER_DEV}
  cloudinary:
    api-key: ${CLOUDINARY_API_KEY}
    secret-key: ${CLOUDINARY_SECRET_KEY}
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    url: ${CLOUDINARY_URL}

jwt:
  secret: ${JWT_SECRET}
