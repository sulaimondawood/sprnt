<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Reset</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }

      .container {
        max-width: 600px;
        margin: 40px auto;
        background-color: #ffffff;
        padding: 24px;
        border-radius: 6px;
      }

      h1 {
        font-size: 18px;
        margin-bottom: 16px;
        color: #111111;
      }

      p {
        font-size: 14px;
        line-height: 1.5;
        color: #444444;
        margin: 0 0 16px;
      }

      .button {
        display: inline-block;
        padding: 12px 18px;
        background-color: #2563eb;
        color: #ffffff;
        text-decoration: none;
        border-radius: 4px;
        font-size: 14px;
      }

      .footer {
        font-size: 12px;
        color: #888888;
        margin-top: 24px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Password Reset</h1>

      <p>
        You requested to reset your password. Click the button below to
        continue.
      </p>

      <p>
        <a th:href="${RESET_LINK}" class="button">Reset Password</a>
      </p>

      <p>If you did not request this, you can safely ignore this email.</p>

      <div class="footer">
        <p>This link will expire in 15 minutes.</p>
      </div>
    </div>
  </body>
</html>
